[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "../deployments" },
]

[fmt]
line_length = 110
ignore = ["lib/**"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64

[rpc_endpoints]
mainnet = "${ETHEREUM_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
